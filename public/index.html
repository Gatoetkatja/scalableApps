<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyek Hands On - Scalable</title>

<style>

body{
  font-family: Arial, sans-serif;
  background:#f5f6fa;
  margin:0;
  padding:40px;
}

.container{
  max-width:900px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:10px;
  box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
}

input{
  padding:10px;
  width:200px;
  border-radius:6px;
  border:1px solid #ccc;
}

button{
  padding:10px 15px;
  border:none;
  border-radius:6px;
  background:#4CAF50;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#45a049;
}

.detail{
  margin-top:25px;
}

.error{
  color:red;
}

.gallery{
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
}

.gallery img{
  width:100%;
  border-radius:8px;
  object-fit:cover;
  transition:transform 0.2s ease, box-shadow 0.2s ease;
}

.gallery img:hover{
  transform:scale(1.05);
  box-shadow:0 4px 15px rgba(0,0,0,0.2);
}

.meta{
  margin-top:15px;
  line-height:1.6;
}

</style>
</head>

<body>

<div class="container">

<h1>Proyek Hands On - Scalable</h1>
<p>Selamat datang di proyek Hands On - Scalable!</p>

<h2>Get Detail</h2>

<input type="text" id="idInput" placeholder="Enter ID"/>
<button onclick="getDetail()">Get Detail</button>

<div id="result" class="detail" style="display:none"></div>

</div>

<script>

async function getDetail(){

  const id = document.getElementById("idInput").value.trim()

  if(!id){
    alert("Please enter an ID")
    return
  }

  try{

    const response = await fetch(`/api/get-koleksi?id=${encodeURIComponent(id)}`)
    const data = await response.json()

    const resultDiv = document.getElementById("result")

    if(response.ok){

      let imagesHTML = ""

      if(Array.isArray(data.paths)){
        imagesHTML = data.paths.map(path =>
          `<img src="https://scalable-apps-ivr5.vercel.app${path}" alt="${data.judul}">`
        ).join("")
      }else if(data.path){
        imagesHTML = `<img src="https://scalable-apps-ivr5.vercel.app${data.path}" alt="${data.judul}">`
      }

      resultDiv.innerHTML = `
        <h3>Detail</h3>

        <div class="meta">
          <p><strong>Judul:</strong> ${data.judul}</p>
          <p><strong>Pencipta:</strong> ${data.pencipta}</p>
          <p><strong>Tahun:</strong> ${new Date(data.tahun).getFullYear()}</p>
          <p><strong>Harga:</strong> ${data.harga}</p>
        </div>

        <div class="gallery">
          ${imagesHTML}
        </div>
      `

      resultDiv.className = "detail"

    }else{

      resultDiv.innerHTML = `<p class="error">Error: ${data.error}</p>`
      resultDiv.className = "detail error"

    }

    resultDiv.style.display="block"

  }catch(error){

    document.getElementById("result").innerHTML =
      `<p class="error">Error fetching data: ${error.message}</p>`

    document.getElementById("result").style.display="block"

  }

}

</script>

</body>
</html>

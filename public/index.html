<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koleksi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0e0e0e;
    --paper: #f5f0e8;
    --cream: #ede7d5;
    --gold: #b8924a;
    --gold-light: #d4a96a;
    --muted: #7a6f5e;
    --card-bg: #faf7f2;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
    opacity: 0.6;
  }

  /* ── HEADER ── */
  header {
    padding: 60px 60px 40px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid rgba(184,146,74,0.3);
    position: relative;
  }

  .header-left { max-width: 520px; }

  .eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .eyebrow::before {
    content: '';
    display: block;
    width: 30px;
    height: 1px;
    background: var(--gold);
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(48px, 7vw, 82px);
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  h1 em {
    font-style: italic;
    color: var(--gold);
  }

  .header-right {
    text-align: right;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    line-height: 2;
  }

  .item-count {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 400;
    color: var(--ink);
    display: block;
    line-height: 1;
  }

  /* ── LOADING STATE ── */
  #loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 100px;
    gap: 20px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .loader-line {
    width: 120px;
    height: 1px;
    background: var(--cream);
    position: relative;
    overflow: hidden;
  }

  .loader-line::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gold);
    animation: loadbar 1.4s ease-in-out infinite;
  }

  @keyframes loadbar {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* ── GALLERY GRID ── */
  #gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 0;
    padding: 0 40px 80px;
  }

  /* ── CARD ── */
  .card {
    position: relative;
    background: var(--card-bg);
    border: 1px solid rgba(184,146,74,0.15);
    margin: -1px -1px 0 0;
    cursor: pointer;
    opacity: 0;
    transform: translateY(30px);
    animation: cardIn 0.6s ease forwards;
    overflow: hidden;
    transition: z-index 0s;
  }

  .card:hover { z-index: 10; }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.15s; }
  .card:nth-child(3) { animation-delay: 0.25s; }
  .card:nth-child(4) { animation-delay: 0.35s; }
  .card:nth-child(5) { animation-delay: 0.45s; }

  .card-img-wrap {
    position: relative;
    height: 260px;
    overflow: hidden;
    background: var(--cream);
  }

  .card-img-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 50%, rgba(14,14,14,0.6) 100%);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .card:hover .card-img-wrap::after { opacity: 1; }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    filter: sepia(10%);
  }

  .card:hover img {
    transform: scale(1.08);
    filter: sepia(0%);
  }

  /* Number badge */
  .card-num {
    position: absolute;
    top: 16px;
    left: 16px;
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    color: white;
    background: rgba(14,14,14,0.5);
    backdrop-filter: blur(4px);
    padding: 4px 10px;
    letter-spacing: 0.1em;
    z-index: 2;
  }

  /* Hover CTA */
  .card-cta {
    position: absolute;
    bottom: 20px;
    right: 20px;
    z-index: 5;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: white;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .card-cta::after {
    content: '→';
    font-size: 14px;
  }

  .card:hover .card-cta {
    opacity: 1;
    transform: translateY(0);
  }

  /* Card body */
  .card-body {
    padding: 24px 24px 28px;
    border-top: 1px solid rgba(184,146,74,0.2);
    position: relative;
  }

  .card-body::before {
    content: '';
    position: absolute;
    top: 0;
    left: 24px;
    width: 0;
    height: 2px;
    background: var(--gold);
    transition: width 0.4s ease;
  }

  .card:hover .card-body::before { width: calc(100% - 48px); }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 14px;
    color: var(--ink);
  }

  .card-meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
  }

  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .meta-label {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    font-weight: 400;
  }

  .meta-value {
    font-size: 12px;
    color: var(--muted);
    font-weight: 300;
  }

  .meta-price {
    grid-column: 1 / -1;
    margin-top: 6px;
    padding-top: 14px;
    border-top: 1px solid var(--cream);
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .meta-price .meta-label { align-self: center; }

  .price-value {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 400;
    color: var(--ink);
  }

  /* ── FORTUNE STRIP ── */
  #fortune-strip {
    margin: 0 40px;
    padding: 24px 32px;
    background: var(--ink);
    color: var(--paper);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    border-radius: 2px;
    min-height: 90px;
    opacity: 0;
    transition: opacity 0.5s ease;
  }

  #fortune-strip.loaded { opacity: 1; }

  .fortune-block { display: flex; flex-direction: column; gap: 6px; }

  .fortune-tag {
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .fortune-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 15px;
    line-height: 1.5;
    color: var(--paper);
  }

  .fortune-meta {
    font-size: 10px;
    color: rgba(245,240,232,0.4);
    margin-top: 2px;
  }

  /* ── FOOTER ── */
  footer {
    margin-top: 60px;
    padding: 30px 60px;
    border-top: 1px solid rgba(184,146,74,0.2);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  footer span { color: var(--gold); }

  /* ── SKELETON ── */
  .skeleton-card {
    background: var(--card-bg);
    border: 1px solid rgba(184,146,74,0.1);
    margin: -1px -1px 0 0;
    overflow: hidden;
  }

  .skeleton-img {
    height: 260px;
    background: linear-gradient(90deg, var(--cream) 25%, var(--paper) 50%, var(--cream) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
  }

  .skeleton-body { padding: 24px; }

  .skeleton-line {
    height: 12px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--cream) 25%, var(--paper) 50%, var(--cream) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    margin-bottom: 10px;
  }

  .skeleton-line.short { width: 60%; }
  .skeleton-line.med { width: 80%; }

  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  @media (max-width: 768px) {
    header { padding: 40px 24px 30px; flex-direction: column; align-items: flex-start; gap: 20px; }
    #gallery { padding: 0 0 60px; }
    #fortune-strip { margin: 0; grid-template-columns: 1fr; }
    footer { padding: 24px; flex-direction: column; gap: 8px; text-align: center; }
    .header-right { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="eyebrow">Arsip Visual</div>
    <h1>Galeri<br><em>Koleksi</em></h1>
  </div>
  <div class="header-right">
    <span id="count-display" class="item-count">—</span>
    karya dalam koleksi<br>
    <span id="year-display">—</span>
  </div>
</header>

<div id="loading" style="display:none"></div>
<div id="gallery" class="gallery"></div>

<div id="fortune-strip">
  <div class="fortune-block" id="serverlessBlock">
    <div class="fortune-tag">Serverless · Loading…</div>
    <div class="fortune-text">—</div>
  </div>
  <div class="fortune-block" id="edgeBlock">
    <div class="fortune-tag">Edge · Loading…</div>
    <div class="fortune-text">—</div>
  </div>
</div>

<footer>
  <div>Koleksi Gallery © <span id="yr"></span></div>
  <div>Ditenagai oleh <span>Vercel</span></div>
</footer>

<script>
  document.getElementById('yr').textContent = new Date().getFullYear();

  // Add skeleton cards while loading
  const gallery = document.getElementById('gallery');
  for (let i = 0; i < 5; i++) {
    gallery.innerHTML += `
      <div class="skeleton-card">
        <div class="skeleton-img"></div>
        <div class="skeleton-body">
          <div class="skeleton-line med"></div>
          <div class="skeleton-line short"></div>
          <div class="skeleton-line short"></div>
        </div>
      </div>`;
  }

  async function loadAll() {
    gallery.innerHTML = '';
    let loaded = 0;

    for (let id = 1; id <= 5; id++) {
      try {
        const response = await fetch(`/api/get-koleksi?id=${id}`);
        const data = await response.json();
        if (response.ok) {
          loaded++;
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-img-wrap">
              <span class="card-num">№ ${String(id).padStart(2,'0')}</span>
              <img src="https://scalable-apps-ivr5.vercel.app${data.path}" alt="${data.judul}" loading="lazy">
              <div class="card-cta">Lihat Karya</div>
            </div>
            <div class="card-body">
              <div class="card-title">${data.judul}</div>
              <div class="card-meta">
                <div class="meta-item">
                  <span class="meta-label">Pencipta</span>
                  <span class="meta-value">${data.pencipta}</span>
                </div>
                <div class="meta-item">
                  <span class="meta-label">Tahun</span>
                  <span class="meta-value">${new Date(data.tahun).getFullYear()}</span>
                </div>
                <div class="meta-item meta-price">
                  <span class="meta-label">Harga</span>
                  <span class="price-value">${data.harga}</span>
                </div>
              </div>
            </div>`;
          gallery.appendChild(card);
        }
      } catch (e) {
        console.log('failed id', id);
      }
    }

    document.getElementById('count-display').textContent = loaded;
    document.getElementById('year-display').textContent = new Date().getFullYear();
  }

  async function loadFortunes() {
    try {
      const [serverless, edge] = await Promise.allSettled([
        fetch('/api/fortune.js').then(r => r.json()),
        fetch('/api/fortune-edge.js').then(r => r.json())
      ]);

      const strip = document.getElementById('fortune-strip');

      if (serverless.status === 'fulfilled') {
        document.getElementById('serverlessBlock').innerHTML = `
          <div class="fortune-tag">Serverless · ${serverless.value.source || 'API'}</div>
          <div class="fortune-text">"${serverless.value.fortune}"</div>`;
      } else {
        document.getElementById('serverlessBlock').innerHTML = `
          <div class="fortune-tag">Serverless</div>
          <div class="fortune-text" style="opacity:0.4">Tidak tersedia</div>`;
      }

      if (edge.status === 'fulfilled') {
        const ts = edge.value.timestamp
          ? new Date(edge.value.timestamp).toLocaleTimeString('id-ID') : '';
        document.getElementById('edgeBlock').innerHTML = `
          <div class="fortune-tag">Edge · ${edge.value.source || 'API'}</div>
          <div class="fortune-text">"${edge.value.fortune}"</div>
          ${ts ? `<div class="fortune-meta">${ts}</div>` : ''}`;
      } else {
        document.getElementById('edgeBlock').innerHTML = `
          <div class="fortune-tag">Edge</div>
          <div class="fortune-text" style="opacity:0.4">Tidak tersedia</div>`;
      }

      strip.classList.add('loaded');
    } catch (e) {
      document.getElementById('fortune-strip').style.display = 'none';
    }
  }

  loadAll();
  loadFortunes();
</script>
</body>
</html>

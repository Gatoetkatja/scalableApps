<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Koleksi Gallery</title>

<style>

body{
  font-family: Arial, sans-serif;
  background:#f4f6f9;
  margin:0;
  padding:40px;
}

.container{
  max-width:1100px;
  margin:auto;
}

h1{
  text-align:center;
  margin-bottom:30px;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}

.card{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,0.1);
  transition:transform .2s, box-shadow .2s;
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:0 12px 25px rgba(0,0,0,0.15);
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
}

.card-content{
  padding:15px;
}

.card-content h3{
  margin:0 0 10px 0;
}

.card-content p{
  margin:3px 0;
  font-size:14px;
  color:#555;
}

</style>
</head>

<body>

<div class="container">

<h1>Gallery Koleksi</h1>

<div id="gallery" class="gallery"></div>

</div>

<script>

async function loadAll(){

  const gallery = document.getElementById("gallery")

  for(let id=1; id<=5; id++){

    try{

      const response = await fetch(`/api/get-koleksi?id=${id}`)
      const data = await response.json()

      if(response.ok){

        const card = document.createElement("div")
        card.className = "card"

        card.innerHTML = `
          <img src="https://scalable-apps-ivr5.vercel.app${data.path}" alt="${data.judul}">
          <div class="card-content">
            <h3>${data.judul}</h3>
            <p><strong>Pencipta:</strong> ${data.pencipta}</p>
            <p><strong>Tahun:</strong> ${new Date(data.tahun).getFullYear()}</p>
            <p><strong>Harga:</strong> ${data.harga}</p>
          </div>
        `

        gallery.appendChild(card)

      }

    }catch(e){
      console.log("failed id", id)
    }

  }

}

loadAll()

</script>
<script>
async function loadFortunes() {

  const serverless = await fetch('/api/fortune.js').then(r => r.json())
  const edge = await fetch('/api/fortune-edge.js').then(r => r.json())

  document.getElementById("serverlessResult").innerHTML = `
    <h3>Serverless</h3>
    <p><strong>Source:</strong> ${serverless.source}</p>
    <p><strong>Fortune:</strong> ${serverless.fortune}</p>
  `

  document.getElementById("edgeResult").innerHTML = `
    <h3>Edge</h3>
    <p><strong>Source:</strong> ${edge.source}</p>
    <p><strong>Fortune:</strong> ${edge.fortune}</p>
    <p><strong>Timestamp:</strong> ${edge.timestamp}</p>
  `

}

loadFortunes()
</script>
<div id="serverlessResult"></div>
<div id="edgeResult"></div>
</body>
</html>
